name: Release

# Publica uma release ao enviar uma tag vX.Y.Z:
# roda os testes, gera o instalador do Windows e anexa à release, junto com os
# arquivos que a atualização automática do aplicativo consulta.
# As notas vêm da seção correspondente do CHANGELOG.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validar versão da tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME não corresponde à versão $PKG do package.json"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Extrair notas do CHANGELOG
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::Seção [$VERSION] não encontrada no CHANGELOG.md"
            exit 1
          fi

      - name: Instalar dependências
        run: npm ci --no-fund --no-audit

      - name: Testes
        run: npm test

      - name: Gerar instalador
        run: npm run dist

      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # latest.yml e .blockmap são lidos pela atualização automática do aplicativo.
          gh release create "$GITHUB_REF_NAME" \
            "dist/Registro-de-Horas-Setup-$VERSION.exe" \
            "dist/Registro-de-Horas-Setup-$VERSION.exe.blockmap" \
            dist/latest.yml \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
